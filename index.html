<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>素材尺寸速查</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f6;
      --surface: #ffffff;
      --surface-2: #eef2ef;
      --text: #17201b;
      --muted: #68736c;
      --line: #dce4df;
      --accent: #16784b;
      --accent-soft: #e4f4eb;
      --blue-soft: #e9f1fb;
      --blue: #2563a9;
      --amber-soft: #fff3d6;
      --amber: #8a5b00;
      --shadow: 0 12px 32px rgba(28, 46, 36, .08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; letter-spacing: 0; }
    button, input, select { font: inherit; letter-spacing: 0; }
    button, a, select { cursor: pointer; }
    .shell { min-height: 100vh; }
    .topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
    .topbar-inner, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .brand-row { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; background: var(--text); color: var(--surface); font-weight: 700; flex: 0 0 auto; }
    h1 { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 600; }
    .subtitle { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .source-link { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; }
    main { padding: 24px 0 54px; }
    .controls { display: grid; grid-template-columns: minmax(260px, 1fr) auto auto; gap: 12px; align-items: center; }
    .search-wrap { position: relative; }
    .search { width: 100%; min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 7px; padding: 0 82px 0 14px; outline: none; }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .shortcut { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; background: var(--surface-2); pointer-events: none; }
    .segments { display: inline-flex; background: var(--surface-2); border-radius: 7px; padding: 3px; gap: 2px; }
    .segment { min-height: 36px; border: 0; border-radius: 5px; padding: 0 12px; color: var(--muted); background: transparent; white-space: nowrap; }
    .segment[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(20, 37, 27, .12); }
    .category { min-height: 42px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--text); padding: 0 34px 0 12px; }
    .scope-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 18px 0 12px; }
    .scope-tabs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .scope { min-height: 34px; border: 1px solid transparent; border-radius: 17px; padding: 0 13px; background: transparent; color: var(--muted); }
    .scope[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 22%, transparent); }
    .result-count { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .notice { display: none; margin: 0 0 12px; padding: 10px 12px; border-radius: 6px; background: var(--amber-soft); color: var(--amber); font-size: 13px; }
    .list { display: grid; gap: 10px; }
    .item { display: grid; grid-template-columns: minmax(250px, 1.4fr) minmax(320px, 1fr); gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; box-shadow: 0 1px 0 rgba(20, 37, 27, .02); }
    .item:hover { border-color: color-mix(in srgb, var(--accent) 38%, var(--line)); box-shadow: var(--shadow); }
    .item-head { display: flex; align-items: flex-start; gap: 10px; }
    .item-title { margin: 0; font-size: 15px; line-height: 1.45; font-weight: 600; }
    .id { margin-top: 6px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .meta { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { display: inline-flex; align-items: center; min-height: 24px; border-radius: 5px; padding: 2px 7px; background: var(--surface-2); color: var(--muted); font-size: 12px; }
    .tag.group { background: var(--blue-soft); color: var(--blue); }
    .dimensions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-self: center; }
    .dimension { min-height: 58px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--text); padding: 8px 9px; text-align: left; overflow: hidden; }
    .dimension:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
    .dimension:disabled { cursor: default; color: #a0aaa4; background: var(--surface-2); }
    .platform { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; text-transform: uppercase; }
    .size { display: block; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    details { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 9px; }
    summary { color: var(--muted); font-size: 12px; width: fit-content; }
    .details-grid { margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 20px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .details-grid b { color: var(--text); font-weight: 600; }
    mark { background: #ffe66b; color: inherit; border-radius: 2px; padding: 0 1px; }
    .empty { display: none; padding: 64px 12px; text-align: center; color: var(--muted); }
    .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 14px); opacity: 0; pointer-events: none; background: var(--text); color: var(--surface); border-radius: 6px; padding: 9px 13px; font-size: 13px; transition: .18s ease; z-index: 20; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 820px) {
      .controls { grid-template-columns: 1fr; }
      .segments { width: 100%; }
      .segment { flex: 1; }
      .category { width: 100%; }
      .item { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .topbar-inner, main { width: min(100% - 20px, 1180px); }
      .brand-row { align-items: flex-start; padding: 13px 0; }
      .source-link { margin-top: 7px; }
      .scope-row { align-items: flex-start; flex-direction: column; }
      .dimensions { grid-template-columns: 1fr; }
      .dimension { min-height: 50px; display: grid; grid-template-columns: 60px 1fr; align-items: center; }
      .platform { margin: 0; }
      .details-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --bg:#121714; --surface:#1b221e; --surface-2:#252e28; --text:#f0f5f2; --muted:#a8b3ac; --line:#344038; --accent:#62d49a; --accent-soft:#183a29; --blue-soft:#1b3048; --blue:#87bfff; --amber-soft:#3a2c11; --amber:#ffd37a; --shadow:0 12px 32px rgba(0,0,0,.24); }
      mark { background:#6f5d00; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner brand-row">
        <div class="brand">
          <div class="brand-mark">LB</div>
          <div><h1>素材尺寸速查</h1><div class="subtitle">站内运营位设计规范 · 2026-09-28 同步</div></div>
        </div>
        <a class="source-link" href="https://up3mczep5h.sg.larksuite.com/wiki/KfutwguutiDpbyk3yd5llVnBgEg?sheet=pkTK4W&amp;table=tblyhKknLmwsOidq&amp;view=vew1oai4Re" target="_blank" rel="noreferrer">查看源表 ↗</a>
      </div>
    </header>
    <main>
      <section class="controls" aria-label="筛选条件">
        <div class="search-wrap"><input id="search" class="search" type="search" placeholder="搜索名称、广告位 ID、场景或尺寸" autocomplete="off"><span class="shortcut">⌘ K</span></div>
        <div class="segments" id="platforms" aria-label="平台筛选">
          <button class="segment" data-platform="all" aria-pressed="true">全部</button>
          <button class="segment" data-platform="w" aria-pressed="false">Web</button>
          <button class="segment" data-platform="h" aria-pressed="false">H5</button>
          <button class="segment" data-platform="a" aria-pressed="false">App</button>
        </div>
        <select id="category" class="category" aria-label="业务分类"><option value="all">全部业务</option><option value="公共">公共</option><option value="交易">交易</option><option value="金融">金融</option><option value="首页">首页</option><option value="现货">现货</option><option value="用户资产">用户资产</option><option value="增长">增长</option></select>
      </section>
      <div class="scope-row">
        <div class="scope-tabs" id="scopes" aria-label="规范类型">
          <button class="scope" data-scope="all" aria-pressed="true">全部规范</button>
          <button class="scope" data-scope="入口规范" aria-pressed="false">入口规范</button>
          <button class="scope" data-scope="活动主视觉" aria-pressed="false">活动主视觉</button>
        </div>
        <div class="result-count" id="count" aria-live="polite">96 / 96 条</div>
      </div>
      <div class="notice" id="notice" style="display: block;">源表部分记录的尺寸列与补充说明不一致；本页优先展示平台尺寸列，并保留原说明供核对。</div>
      <section id="list" class="list" aria-label="素材尺寸列表"></section>
      <div id="empty" class="empty" style="display: none;">没有匹配的素材尺寸</div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
    const data = JSON.parse(document.getElementById('data').textContent);
    const state = { q: '', platform: 'all', scope: 'all', category: 'all' };
    const els = { search: document.getElementById('search'), category: document.getElementById('category'), list: document.getElementById('list'), count: document.getElementById('count'), empty: document.getElementById('empty'), notice: document.getElementById('notice'), toast: document.getElementById('toast') };
    const unavailable = v => !v || /^(无|--|—)$/.test(v.trim());
    const searchable = item => Object.values(item).join(' ').toLowerCase();
    const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function highlight(text, q) { const safe = esc(text); if (!q) return safe; const needle = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); return safe.replace(new RegExp(`(${needle})`, 'ig'), '<mark>$1</mark>'); }
    function render() {
      const q = state.q.trim().toLowerCase();
      const rows = data.filter(item => {
        if (state.scope !== 'all' && item.g !== state.scope) return false;
        if (state.category !== 'all' && item.c !== state.category) return false;
        if (state.platform !== 'all' && unavailable(item[state.platform])) return false;
        return !q || searchable(item).includes(q);
      });
      els.count.textContent = `${rows.length} / ${data.length} 条`;
      els.empty.style.display = rows.length ? 'none' : 'block';
      els.notice.style.display = rows.some(r => r.x && /尺寸/.test(r.x) && /\d/.test(r.x)) ? 'block' : 'none';
      els.list.innerHTML = rows.map((item, index) => {
        const dims = [['w','Web'],['h','H5'],['a','App']].map(([key,label]) => {
          const disabled = unavailable(item[key]);
          return `<button class="dimension" data-copy="${esc(item[key])}" ${disabled ? 'disabled' : ''} aria-label="复制 ${label} 尺寸 ${esc(item[key] || '无')}"><span class="platform">${label}</span><span class="size">${esc(disabled ? '—' : item[key])}</span></button>`;
        }).join('');
        const details = [item.d && `<div><b>说明：</b>${highlight(item.d, q)}</div>`, item.m && `<div><b>制作要求：</b>${highlight(item.m, q)}</div>`, item.x && `<div><b>源表补充：</b>${highlight(item.x, q)}</div>`].filter(Boolean).join('');
        return `<article class="item" data-index="${index}"><div><div class="item-head"><div><h2 class="item-title">${highlight(item.n, q)}</h2>${item.id ? `<div class="id">${highlight(item.id, q)}</div>` : ''}</div></div><div class="meta"><span class="tag group">${esc(item.g)}</span>${item.c ? `<span class="tag">${esc(item.c)}</span>` : ''}${item.s ? `<span class="tag">${highlight(item.s, q)}</span>` : ''}</div></div><div class="dimensions">${dims}</div>${details ? `<details><summary>查看制作说明</summary><div class="details-grid">${details}</div></details>` : ''}</article>`;
      }).join('');
    }
    const categories = [...new Set(data.map(d => d.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
    els.category.insertAdjacentHTML('beforeend', categories.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join(''));
    els.search.addEventListener('input', e => { state.q = e.target.value; render(); });
    els.category.addEventListener('change', e => { state.category = e.target.value; render(); });
    document.getElementById('platforms').addEventListener('click', e => { const b=e.target.closest('button'); if(!b)return; state.platform=b.dataset.platform; e.currentTarget.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); render(); });
    document.getElementById('scopes').addEventListener('click', e => { const b=e.target.closest('button'); if(!b)return; state.scope=b.dataset.scope; e.currentTarget.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); render(); });
    els.list.addEventListener('click', async e => { const b=e.target.closest('[data-copy]'); if(!b || b.disabled)return; try { await navigator.clipboard.writeText(b.dataset.copy); els.toast.textContent=`已复制 ${b.dataset.copy}`; els.toast.classList.add('show'); clearTimeout(window.__toast); window.__toast=setTimeout(()=>els.toast.classList.remove('show'),1400); } catch { els.toast.textContent='复制失败，请手动选择'; els.toast.classList.add('show'); } });
    document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k') { e.preventDefault(); els.search.focus(); } if (e.key==='Escape' && document.activeElement===els.search) { els.search.value=''; state.q=''; render(); } });
    render();
    });
  </script>
