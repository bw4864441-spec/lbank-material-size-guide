<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>素材尺寸速查</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f6;
      --surface: #ffffff;
      --surface-2: #eef2ef;
      --text: #17201b;
      --muted: #68736c;
      --line: #dce4df;
      --accent: #16784b;
      --accent-soft: #e4f4eb;
      --blue-soft: #e9f1fb;
      --blue: #2563a9;
      --amber-soft: #fff3d6;
      --amber: #8a5b00;
      --shadow: 0 12px 32px rgba(28, 46, 36, .08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; letter-spacing: 0; }
    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button, a, select { cursor: pointer; }
    .shell { min-height: 100vh; }
    .topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
    .topbar-inner, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .brand-row { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; background: var(--text); color: var(--surface); font-weight: 700; flex: 0 0 auto; }
    h1 { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 600; }
    .subtitle { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .source-link { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; }
    main { padding: 24px 0 54px; }
    .controls { display: grid; grid-template-columns: minmax(260px, 1fr) auto auto; gap: 12px; align-items: center; }
    .search-wrap { position: relative; }
    .search { width: 100%; min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 7px; padding: 0 82px 0 14px; outline: none; }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .shortcut { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; background: var(--surface-2); pointer-events: none; }
    .segments { display: inline-flex; background: var(--surface-2); border-radius: 7px; padding: 3px; gap: 2px; }
    .segment { min-height: 36px; border: 0; border-radius: 5px; padding: 0 12px; color: var(--muted); background: transparent; white-space: nowrap; }
    .segment[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(20, 37, 27, .12); }
    .category { min-height: 42px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--text); padding: 0 34px 0 12px; }
    .scope-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 18px 0 12px; }
    .scope-tabs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .scope { min-height: 34px; border: 1px solid transparent; border-radius: 17px; padding: 0 13px; background: transparent; color: var(--muted); }
    .scope[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 22%, transparent); }
    .result-count { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .notice { display: none; margin: 0 0 12px; padding: 10px 12px; border-radius: 6px; background: var(--amber-soft); color: var(--amber); font-size: 13px; }
    .list { display: grid; gap: 10px; }
    .item { display: grid; grid-template-columns: minmax(250px, 1.4fr) minmax(320px, 1fr); gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; box-shadow: 0 1px 0 rgba(20, 37, 27, .02); }
    .item:hover { border-color: color-mix(in srgb, var(--accent) 38%, var(--line)); box-shadow: var(--shadow); }
    .item-head { display: flex; align-items: flex-start; gap: 10px; }
    .item-title { margin: 0; font-size: 15px; line-height: 1.45; font-weight: 600; }
    .id { margin-top: 6px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .meta { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { display: inline-flex; align-items: center; min-height: 24px; border-radius: 5px; padding: 2px 7px; background: var(--surface-2); color: var(--muted); font-size: 12px; }
    .tag.group { background: var(--blue-soft); color: var(--blue); }
    .dimensions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-self: center; }
    .dimension { min-height: 118px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--text); padding: 8px 9px; overflow: hidden; }
    .dimension:hover:not(.is-disabled) { border-color: color-mix(in srgb, var(--accent) 52%, var(--line)); }
    .dimension.is-disabled { color: #a0aaa4; background: var(--surface-2); }
    .dimension-head, .media-row, .detail-head, .edit-actions { display: flex; align-items: center; gap: 6px; }
    .dimension-head { justify-content: space-between; min-height: 24px; }
    .platform { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .size-copy { display: block; width: 100%; margin: 2px 0 0; padding: 0; border: 0; background: transparent; color: inherit; text-align: left; }
    .size { display: block; min-height: 21px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .size-copy:not(:disabled):hover .size { color: var(--accent); }
    .icon-btn { width: 28px; height: 28px; flex: 0 0 28px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--muted); padding: 0; line-height: 1; }
    .icon-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .icon-btn:disabled { cursor: default; opacity: .42; }
    .media-row { margin-top: 7px; min-height: 28px; display: grid; grid-template-columns: repeat(3, 28px); align-items: center; }
    .media-info { min-width: 0; grid-column: 1 / -1; color: var(--muted); font-size: 11px; line-height: 1.25; }
    .media-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .media-status { display: block; margin-top: 2px; white-space: nowrap; }
    .media-status.match { color: var(--accent); }
    .media-status.mismatch { color: #bd3a32; }
    details { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 9px; }
    summary { color: var(--muted); font-size: 12px; width: fit-content; }
    .detail-head { justify-content: space-between; margin-top: 10px; }
    .details-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 20px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .details-grid b, .edit-field label { color: var(--text); font-weight: 600; }
    .detail-value:empty::after { content: "未填写"; color: var(--muted); opacity: .72; }
    .details-editor { display: grid; gap: 10px; }
    .edit-field { display: grid; gap: 5px; }
    .edit-field textarea { width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 8px 9px; background: var(--surface); color: var(--text); outline: none; }
    .edit-field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .edit-actions { justify-content: flex-end; }
    .text-btn { min-height: 32px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; background: var(--surface); color: var(--text); }
    .text-btn.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .storage-note { margin: 14px 0 0; color: var(--muted); font-size: 12px; text-align: right; }
    dialog { width: min(920px, calc(100% - 28px)); max-height: calc(100vh - 40px); border: 1px solid var(--line); border-radius: 8px; padding: 0; background: var(--surface); color: var(--text); box-shadow: 0 24px 80px rgba(0,0,0,.28); }
    dialog::backdrop { background: rgba(7, 12, 9, .72); }
    .preview-head { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); }
    .preview-title { min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview-body { display: grid; place-items: center; min-height: 220px; padding: 16px; background: var(--surface-2); }
    .preview-body img, .preview-body video { display: block; max-width: 100%; max-height: calc(100vh - 130px); object-fit: contain; }
    mark { background: #ffe66b; color: inherit; border-radius: 2px; padding: 0 1px; }
    .empty { display: none; padding: 64px 12px; text-align: center; color: var(--muted); }
    .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 14px); opacity: 0; pointer-events: none; background: var(--text); color: var(--surface); border-radius: 6px; padding: 9px 13px; font-size: 13px; transition: .18s ease; z-index: 20; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 820px) {
      .controls { grid-template-columns: 1fr; }
      .segments { width: 100%; }
      .segment { flex: 1; }
      .category { width: 100%; }
      .item { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .topbar-inner, main { width: min(100% - 20px, 1180px); }
      .brand-row { align-items: flex-start; padding: 13px 0; }
      .source-link { margin-top: 7px; }
      .scope-row { align-items: flex-start; flex-direction: column; }
      .dimensions { grid-template-columns: 1fr; }
      .dimension { min-height: 118px; }
      .details-grid { grid-template-columns: 1fr; }
      .icon-btn { width: 34px; height: 34px; flex-basis: 34px; }
      .media-row { grid-template-columns: repeat(3, 34px); align-items: end; }
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --bg:#121714; --surface:#1b221e; --surface-2:#252e28; --text:#f0f5f2; --muted:#a8b3ac; --line:#344038; --accent:#62d49a; --accent-soft:#183a29; --blue-soft:#1b3048; --blue:#87bfff; --amber-soft:#3a2c11; --amber:#ffd37a; --shadow:0 12px 32px rgba(0,0,0,.24); }
      mark { background:#6f5d00; }
      .media-status.mismatch { color:#ff8c83; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner brand-row">
        <div class="brand">
          <div class="brand-mark">LB</div>
          <div><h1>素材尺寸速查</h1><div class="subtitle">站内运营位设计规范 · 2026-09-28 同步</div></div>
        </div>
        <a class="source-link" href="https://up3mczep5h.sg.larksuite.com/wiki/KfutwguutiDpbyk3yd5llVnBgEg?sheet=pkTK4W&table=tblyhKknLmwsOidq&view=vew1oai4Re" target="_blank" rel="noreferrer">查看源表 ↗</a>
      </div>
    </header>
    <main>
      <section class="controls" aria-label="筛选条件">
        <div class="search-wrap"><input id="search" class="search" type="search" placeholder="搜索名称、广告位 ID、场景或尺寸" autocomplete="off"><span class="shortcut">⌘ K</span></div>
        <div class="segments" id="platforms" aria-label="平台筛选">
          <button class="segment" data-platform="all" aria-pressed="true">全部</button>
          <button class="segment" data-platform="w" aria-pressed="false">Web</button>
          <button class="segment" data-platform="h" aria-pressed="false">H5</button>
          <button class="segment" data-platform="a" aria-pressed="false">App</button>
        </div>
        <select id="category" class="category" aria-label="业务分类"><option value="all">全部业务</option></select>
      </section>
      <div class="scope-row">
        <div class="scope-tabs" id="scopes" aria-label="规范类型">
          <button class="scope" data-scope="all" aria-pressed="true">全部规范</button>
          <button class="scope" data-scope="入口规范" aria-pressed="false">入口规范</button>
          <button class="scope" data-scope="活动主视觉" aria-pressed="false">活动主视觉</button>
        </div>
        <div class="result-count" id="count" aria-live="polite"></div>
      </div>
      <div class="notice" id="notice">源表部分记录的尺寸列与补充说明不一致；本页优先展示平台尺寸列，并保留原说明供核对。</div>
      <section id="list" class="list" aria-label="素材尺寸列表"></section>
      <div id="empty" class="empty">没有匹配的素材尺寸</div>
      <p class="storage-note">编辑文字与上传素材仅保存在当前浏览器</p>
    </main>
    <input id="mediaInput" type="file" accept="image/*,video/*" hidden>
    <dialog id="previewDialog" aria-labelledby="previewTitle">
      <div class="preview-head"><div id="previewTitle" class="preview-title"></div><button id="previewClose" class="icon-btn" type="button" title="关闭预览" aria-label="关闭预览">×</button></div>
      <div id="previewBody" class="preview-body"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const data = JSON.parse(document.getElementById('data').textContent).map((item, index) => ({ ...item, _index: index }));
      const STORAGE_KEY = 'material-size-guide-text-v1';
      const DB_NAME = 'material-size-guide-media';
      const STORE_NAME = 'assets';
      const state = { q: '', platform: 'all', scope: 'all', category: 'all', editing: null, uploadTarget: null };
      const mediaCache = new Map();
      let previewUrl = '';
      let dbPromise;
      let textOverrides = {};
      try { textOverrides = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { textOverrides = {}; }

      const els = {
        search: document.getElementById('search'), category: document.getElementById('category'),
        list: document.getElementById('list'), count: document.getElementById('count'),
        empty: document.getElementById('empty'), notice: document.getElementById('notice'),
        toast: document.getElementById('toast'), mediaInput: document.getElementById('mediaInput'),
        previewDialog: document.getElementById('previewDialog'), previewTitle: document.getElementById('previewTitle'),
        previewBody: document.getElementById('previewBody'), previewClose: document.getElementById('previewClose')
      };
      const unavailable = value => !value || /^(无|--|—)$/.test(value.trim());
      const esc = value => String(value || '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
      const merged = item => ({ ...item, ...(textOverrides[item._index] || {}) });
      const searchable = item => Object.entries(merged(item)).filter(([key]) => key !== '_index').map(([, value]) => value).join(' ').toLowerCase();
      const mediaKey = (index, platform) => `${index}:${platform}`;

      function highlight(text, query) {
        const safe = esc(text);
        if (!query) return safe;
        const needle = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return safe.replace(new RegExp(`(${needle})`, 'ig'), '<mark>$1</mark>');
      }

      function showToast(message) {
        els.toast.textContent = message;
        els.toast.classList.add('show');
        clearTimeout(window.__toast);
        window.__toast = setTimeout(() => els.toast.classList.remove('show'), 1800);
      }

      function openDb() {
        if (!('indexedDB' in window)) return Promise.reject(new Error('浏览器不支持本地素材存储'));
        if (!dbPromise) {
          dbPromise = new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = () => request.result.createObjectStore(STORE_NAME, { keyPath: 'key' });
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });
        }
        return dbPromise;
      }

      async function dbAction(mode, value) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(STORE_NAME, mode === 'getAll' ? 'readonly' : 'readwrite');
          const store = transaction.objectStore(STORE_NAME);
          const request = mode === 'put' ? store.put(value) : mode === 'delete' ? store.delete(value) : store.getAll();
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      function expectedSizes(spec, type) {
        const normalized = String(spec || '').replace(/[xX*]/g, '×');
        const label = type.startsWith('video/') ? '视频' : '静态';
        const specific = normalized.match(new RegExp(`${label}\\s*(\\d+)\\s*×\\s*(\\d+)`, 'i'));
        if (specific) return [[Number(specific[1]), Number(specific[2])]];
        return [...normalized.matchAll(/(\d+)\s*×\s*(\d+)/g)].map(match => [Number(match[1]), Number(match[2])]);
      }

      function validationFor(record, spec) {
        if (!record || !record.width || !record.height) return { className: '', text: '已上传' };
        const expected = expectedSizes(spec, record.type);
        const actual = `${record.width}×${record.height}`;
        if (!expected.length) return { className: '', text: actual };
        const matched = expected.some(([width, height]) => width === record.width && height === record.height);
        return { className: matched ? 'match' : 'mismatch', text: `${actual} · ${matched ? '尺寸匹配' : '尺寸不符'}` };
      }

      function dimensionMarkup(item, platform, label) {
        const disabled = unavailable(item[platform]);
        const record = mediaCache.get(mediaKey(item._index, platform));
        const status = validationFor(record, item[platform]);
        return `<div class="dimension${disabled ? ' is-disabled' : ''}">
          <div class="dimension-head"><span class="platform">${label}</span><button class="icon-btn" type="button" data-action="upload" data-index="${item._index}" data-platform="${platform}" title="${record ? '替换素材' : '上传素材'}" aria-label="${record ? '替换' : '上传'} ${label} 素材" ${disabled ? 'disabled' : ''}>＋</button></div>
          <button class="size-copy" type="button" data-copy="${esc(item[platform])}" title="复制尺寸" aria-label="复制 ${label} 尺寸 ${esc(item[platform] || '无')}" ${disabled ? 'disabled' : ''}><span class="size">${esc(disabled ? '—' : item[platform])}</span></button>
          ${disabled ? '' : `<div class="media-row"><div class="media-info">${record ? `<span class="media-name" title="${esc(record.name)}">${esc(record.name)}</span><span class="media-status ${status.className}">${status.text}</span>` : '<span class="media-name">未上传</span>'}</div>${record ? `<button class="icon-btn" type="button" data-action="preview" data-key="${record.key}" title="预览素材" aria-label="预览素材">↗</button><button class="icon-btn" type="button" data-action="download" data-key="${record.key}" title="下载素材" aria-label="下载素材">↓</button><button class="icon-btn" type="button" data-action="remove" data-key="${record.key}" title="移除素材" aria-label="移除素材">×</button>` : ''}</div>`}
        </div>`;
      }

      function detailMarkup(item, query) {
        if (state.editing === item._index) {
          return `<div class="detail-head"><div></div><div class="edit-actions"><button class="text-btn" type="button" data-action="cancel-edit">× 取消</button><button class="text-btn primary" type="button" data-action="save-edit">✓ 保存</button></div></div><div class="details-editor">
            <div class="edit-field"><label for="edit-d-${item._index}">说明</label><textarea id="edit-d-${item._index}" data-field="d">${esc(item.d)}</textarea></div>
            <div class="edit-field"><label for="edit-m-${item._index}">制作要求</label><textarea id="edit-m-${item._index}" data-field="m">${esc(item.m)}</textarea></div>
            <div class="edit-field"><label for="edit-x-${item._index}">源表补充</label><textarea id="edit-x-${item._index}" data-field="x">${esc(item.x)}</textarea></div>
          </div>`;
        }
        return `<div class="detail-head"><div class="details-grid"><div><b>说明：</b><span class="detail-value">${highlight(item.d, query)}</span></div><div><b>制作要求：</b><span class="detail-value">${highlight(item.m, query)}</span></div><div><b>源表补充：</b><span class="detail-value">${highlight(item.x, query)}</span></div></div><button class="icon-btn" type="button" data-action="edit" title="编辑制作说明" aria-label="编辑制作说明">✎</button></div>`;
      }

      function render() {
        const query = state.q.trim().toLowerCase();
        const rows = data.filter(source => {
          const item = merged(source);
          if (state.scope !== 'all' && item.g !== state.scope) return false;
          if (state.category !== 'all' && item.c !== state.category) return false;
          if (state.platform !== 'all' && unavailable(item[state.platform])) return false;
          return !query || searchable(source).includes(query);
        });
        els.count.textContent = `${rows.length} / ${data.length} 条`;
        els.empty.style.display = rows.length ? 'none' : 'block';
        els.notice.style.display = rows.some(source => { const item = merged(source); return item.x && /尺寸/.test(item.x) && /\d/.test(item.x); }) ? 'block' : 'none';
        els.list.innerHTML = rows.map(source => {
          const item = merged(source);
          const dimensions = [['w','Web'], ['h','H5'], ['a','App']].map(([platform, label]) => dimensionMarkup(item, platform, label)).join('');
          return `<article class="item" data-index="${item._index}"><div><div class="item-head"><div><h2 class="item-title">${highlight(item.n, query)}</h2>${item.id ? `<div class="id">${highlight(item.id, query)}</div>` : ''}</div></div><div class="meta"><span class="tag group">${esc(item.g)}</span>${item.c ? `<span class="tag">${esc(item.c)}</span>` : ''}${item.s ? `<span class="tag">${highlight(item.s, query)}</span>` : ''}</div></div><div class="dimensions">${dimensions}</div><details ${state.editing === item._index ? 'open' : ''}><summary>查看制作说明</summary>${detailMarkup(item, query)}</details></article>`;
        }).join('');
      }

      function readMediaDimensions(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const cleanup = () => URL.revokeObjectURL(url);
          if (file.type.startsWith('image/')) {
            const image = new Image();
            image.onload = () => { const result = { width: image.naturalWidth, height: image.naturalHeight }; cleanup(); resolve(result); };
            image.onerror = () => { cleanup(); reject(new Error('无法读取图片')); };
            image.src = url;
          } else {
            const video = document.createElement('video');
            video.preload = 'metadata';
            video.onloadedmetadata = () => { const result = { width: video.videoWidth, height: video.videoHeight }; cleanup(); resolve(result); };
            video.onerror = () => { cleanup(); reject(new Error('无法读取视频')); };
            video.src = url;
          }

      function closePreview() {

        previewUrl = '';
      }

      const categories = [...new Set(data.map(item => item.c).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
      els.category.insertAdjacentHTML('beforeend', categories.map(category => `<option value="${esc(category)}">${esc(category)}</option>`).join(''));
      els.search.addEventListener('input', event => { state.q = event.target.value; render(); });
      els.category.addEventListener('change', event => { state.category = event.target.value; render(); });
      document.getElementById('platforms').addEventListener('click', event => { const button = event.target.closest('button'); if (!button) return; state.platform = button.dataset.platform; event.currentTarget.querySelectorAll('button').forEach(item => item.setAttribute('aria-pressed', item === button)); render(); });
      document.getElementById('scopes').addEventListener('click', event => { const button = event.target.closest('button'); if (!button) return; state.scope = button.dataset.scope; event.currentTarget.querySelectorAll('button').forEach(item => item.setAttribute('aria-pressed', item === button)); render(); });

      els.list.addEventListener('click', async event => {
        const article = event.target.closest('.item');
        const button = event.target.closest('button');
        if (!button || !article || button.disabled) return;
        const index = Number(article.dataset.index);
        const action = button.dataset.action;
        if (button.dataset.copy) {
          try { await navigator.clipboard.writeText(button.dataset.copy); showToast(`已复制 ${button.dataset.copy}`); }
          catch { showToast('复制失败，请手动选择'); }
          return;
        }
        if (action === 'edit') {
          state.editing = index;
          render();
          document.getElementById(`edit-d-${index}`)?.focus();
        } else if (action === 'cancel-edit') {
          state.editing = null;
          render();
        } else if (action === 'save-edit') {
          const values = {};
          article.querySelectorAll('[data-field]').forEach(field => { values[field.dataset.field] = field.value.trim(); });
          textOverrides[index] = values;
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(textOverrides)); }
          catch { showToast('浏览器无法保存编辑内容'); return; }
          state.editing = null;
          render();
          showToast('制作说明已保存');

          const record = mediaCache.get(button.dataset.key);

          els.previewBody.append(media);
          els.previewDialog.showModal();
        } else if (action === 'download') {
          const record = mediaCache.get(button.dataset.key);
          if (!record) return;
          const url = URL.createObjectURL(record.blob);
          const link = document.createElement('a');
          link.href = url; link.download = record.name; link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } else if (action === 'remove') {
          const record = mediaCache.get(button.dataset.key);
          if (!record || !confirm(`移除本地素材“${record.name}”？`)) return;

      });

      els.mediaInput.addEventListener('change', async () => {
        const file = els.mediaInput.files?.[0];

        if (!file || !target) return;

      });

      render();

    });
